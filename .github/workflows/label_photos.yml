name: Label Photos (Qwen 2.5-VL AI)

on:
  workflow_dispatch:
  push:
    paths:
      - 'input_encrypted/**.enc'
      - '.github/workflows/label_photos.yml'

jobs:
  label-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Count encrypted photos
        id: check
        shell: bash
        run: |
          count=$(find input_encrypted -name "*.enc" 2>/dev/null | wc -l)
          echo "enc_count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count encrypted photos."

      - name: Cache Ollama model
        if: steps.check.outputs.enc_count != '0'
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-qwen2.5vl:7b-v1

      - name: Install and start Ollama
        if: steps.check.outputs.enc_count != '0'
        shell: bash
        run: |
          curl -fsSL https://ollama.ai/install.sh | sh
          ollama serve &>/tmp/ollama.log &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags >/dev/null 2>&1 && echo "Ollama ready" && break || sleep 2
          done

      - name: Pull qwen2.5vl:7b
        if: steps.check.outputs.enc_count != '0'
        run: ollama pull qwen2.5vl:7b

      - name: Set up Python 3.11
        if: steps.check.outputs.enc_count != '0'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        if: steps.check.outputs.enc_count != '0'
        run: pip install --quiet cryptography pillow requests

      - name: Decrypt and label photos with Qwen 2.5-VL
        if: steps.check.outputs.enc_count != '0'
        env:
          DECRYPT_KEY: ${{ secrets.PHOTO_DECRYPT_KEY }}
          OLLAMA_URL: http://localhost:11434
          OLLAMA_MODEL: qwen2.5vl:7b
        run: python scripts/decrypt_and_label.py

      - name: Commit labels back to repo
        if: steps.check.outputs.enc_count != '0'
        shell: bash
        run: |
          git config user.name "LabelBot"
          git config user.email "labelbot@users.noreply.github.com"
          git add output_labels/
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Auto-labeled by qwen2.5vl:7b $(date +'%Y-%m-%d %H:%M')"
            for i in {1..15}; do
              git pull --rebase -X theirs origin main && git push origin main && break || (git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 5 + 3)))
            done
          fi
