name: Generate Encrypted UGC Ad

on:
  workflow_dispatch:
  push:
    paths:
      - 'generate_input/**'
      - '.github/workflows/generate_ad.yml'

jobs:
  generate-ad:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Count reference photos
        id: check
        shell: bash
        run: |
          count=$(find generate_input -name "*.enc" 2>/dev/null | wc -l)
          echo "ref_count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count encrypted reference photo(s)."

      - name: Cache HuggingFace models
        if: steps.check.outputs.ref_count != '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-diffusers-sd15-ipadapter-v1

      - name: Set up Python 3.11
        if: steps.check.outputs.ref_count != '0'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps (CPU)
        if: steps.check.outputs.ref_count != '0'
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet diffusers transformers accelerate pillow cryptography

      - name: Generate encrypted UGC ad
        if: steps.check.outputs.ref_count != '0'
        env:
          DECRYPT_KEY: ${{ secrets.PHOTO_DECRYPT_KEY }}
        run: python scripts/generate_ad.py

      - name: Commit encrypted ads back to repo
        if: steps.check.outputs.ref_count != '0'
        shell: bash
        run: |
          git config user.name "AdBot"
          git config user.email "adbot@users.noreply.github.com"
          git add generate_output/
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Auto-generated encrypted ad $(date +'%Y-%m-%d %H:%M')"
            for i in {1..5}; do
              git pull --rebase origin main && git push origin main && break || sleep 3
            done
          fi
